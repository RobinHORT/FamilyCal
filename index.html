<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Yimly FamilyCal</title>
    <meta name="description" content="Self-hosted family calendar and organizer with shared and individual member schedules, tasks, and optional two-way Google Calendar synchronization." />
    <meta property="og:title" content="Yimly FamilyCal" />
    <meta property="og:description" content="Self-hosted family calendar and organizer with shared and individual member schedules, tasks, and optional two-way Google Calendar synchronization." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#121620" />
    <meta name="application-name" content="FamilyCal" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FamilyCal" />
    <meta name="msapplication-TileColor" content="#121620" />
    <meta name="msapplication-TileImage" content="/pwa-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@400..700&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] antialiased selection:bg-[#F8BBD0] selection:text-[#831843] font-sans overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
